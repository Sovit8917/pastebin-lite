services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pastebin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pastebin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pastebin"]
      interval: 3s
      timeout: 3s
      retries: 10
volumes:
  pgdata:
